<button class="mpg-filter-open-btn mpg-layout-container" [color]="filterApplied ? 'accent': 'none'" mat-stroked-button type="button" #menuTrigger="matMenuTrigger" [matMenuTriggerFor]="numberFilterMenu" (menuOpened)="menuOpened()">
    @if (!filterApplied) {
        <span class="mpg-placeholder mpg-font-weight-normal">Unfiltered</span>
    } @else {
        <span class="mpg-text-truncate">{{filterParam}}</span>
    }
    <div class="mpg-select-arrow"></div>
</button>

<mat-menu #numberFilterMenu="matMenu" class="mpg-overflow-hidden">
    <div class="mpg-filter-container" (click)="$event.stopPropagation()" (keydown.tab)="$event.stopPropagation()" (keydown.shift.tab)="$event.stopPropagation()">
        <div class="mpg-layout-container">
            <button mat-stroked-button type="button" color="primary" (click)="validate()" class="mpg-mr-2 mpg-small-stroked-button">Filter</button>
            <button mat-stroked-button type="button" color="warn" (click)="reset(true)" class="mpg-small-stroked-button">Reset</button>
        </div>
        <div class="mpg-layout-container">
            <mat-form-field class="mpg-w-100 mpg-mt-3">
                <mat-select [formControl]="selection" placeholder="Logic" (selectionChange)="changeSelection()">
                    @for (item of stringFilterTypes; track item) {
                        <mat-option class="mpg-mat-option" [value]="item.value">{{item.text}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>

        <div class="mpg-layout-container">
            <mat-form-field class="mpg-w-100">
                <input matInput #valueElement type="text" placeholder="Value" [formControl]="value" (keyup.enter)="validate()">
            </mat-form-field>
        </div>
        <div class="mpg-layout-container">
            @if (invalidValue) {
                <span class="mpg-invalid-error">Invalid value entered</span>
            }
        </div>
    </div>
</mat-menu>
